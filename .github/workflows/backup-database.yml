# Backup settimanale del database Supabase, cifrato.
#
# Perché: sul piano gratuito Supabase non permette di tornare a un momento
# preciso. Se un dato viene cancellato per sbaglio (o da un bug), senza una
# copia è perso: scuole, classi, risposte dei questionari.
#
# Il repo è PUBBLICO: gli artifact di GitHub li può scaricare chiunque abbia un
# account. Per questo il backup viene cifrato (AES-256) prima di uscire dal
# runner, e senza la passphrase non si apre. La struttura del database NON
# viene messa in chiaro nel repo: le funzioni dei trigger possono contenere
# chiavi.
#
# Secret da impostare (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     Dashboard Supabase → Connect → "Session pooler" → URI
#                       (con la password del database al posto di [YOUR-PASSWORD])
#   BACKUP_PASSPHRASE   una frase lunga a piacere. Conservala fuori da GitHub
#                       (gestore password): senza, i backup sono illeggibili.
#
# Ripristino: vedi supabase/functions/CONFIGURAZIONE.md, sezione Backup.

name: Backup database

on:
  schedule:
    - cron: '17 2 * * 1'    # ogni lunedì alle 02:17 UTC
  workflow_dispatch:        # anche a mano dalla tab Actions

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}

    steps:
      - name: Controlla i secret
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::error::Mancano SUPABASE_DB_URL e/o BACKUP_PASSPHRASE nei secret del repo"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Esporta ruoli, struttura e dati
        run: |
          mkdir -p backup
          supabase db dump --db-url "$DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$DB_URL" -f backup/data.sql --use-copy --data-only
          ls -la backup

      - name: Cifra
        run: |
          NOME="sane-backup-$(date -u +%Y-%m-%d)"
          echo "NOME=$NOME" >> "$GITHUB_ENV"
          tar czf - backup | gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$PASSPHRASE" --symmetric --cipher-algo AES256 \
            -o "$NOME.tar.gz.gpg"
          rm -rf backup
          ls -la "$NOME.tar.gz.gpg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOME }}
          path: ${{ env.NOME }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
