# Ridistribuisce le Edge Functions su Supabase a ogni push su main.
#
# Perché esiste: Netlify guarda questo repo e pubblica il sito da solo, ma
# Supabase no — le funzioni girano sui suoi server e finora andavano caricate
# a mano dal pannello. Risultato: il file qui e quello che gira davvero
# potevano divergere senza che nessuno se ne accorgesse.
#
# Serve il secret SUPABASE_ACCESS_TOKEN nelle impostazioni del repo GitHub
# (Settings → Secrets and variables → Actions). Si genera su
# https://supabase.com/dashboard/account/tokens
#
# ATTENZIONE al flag --no-verify-jwt: dice a Supabase se la funzione deve
# pretendere un token valido per essere chiamata. Deve corrispondere a com'è
# configurata adesso ciascuna funzione, altrimenti il deploy la cambia e
# smette di funzionare. Se aggiungi una funzione, aggiungila anche qui con
# il flag giusto.

name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:        # permette di lanciarlo a mano dalla tab Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: hjfosliokfskftmoukxa

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Chiamate dal portale senza JWT: l'autenticazione è fatta dentro la
      # funzione (verifica del token nel body, firma HMAC per stripe-webhook).
      - name: Funzioni del portale e pagamenti
        run: |
          supabase functions deploy crea-checkout   --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy verify-payment  --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy riscatta-codice --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy elimina-utente  --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy stripe-webhook  --project-ref "$PROJECT_REF" --no-verify-jwt

      # Funzioni di notifica, innescate da trigger/webhook del database.
      # I flag qui sotto vanno confermati guardando il toggle "Verify JWT" di
      # ciascuna nel pannello Supabase, prima di fidarsi di questo workflow.
      - name: Funzioni di notifica
        run: |
          supabase functions deploy nuova-registrazione   --project-ref "$PROJECT_REF"
          supabase functions deploy notifica-approvazione --project-ref "$PROJECT_REF"
          supabase functions deploy avviso-scadenza       --project-ref "$PROJECT_REF"
