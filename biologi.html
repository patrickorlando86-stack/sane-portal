/* ---- LA RETE + NOTA CONTATTI ---- */
.biologi-sec{background:linear-gradient(180deg,var(--cr) 0%,#fff 100%)}
.biologi-cols{display:grid;grid-template-columns:1.05fr .95fr;gap:3.5rem;align-items:center}

.legend-dot.espansione{background:#94a3b8;box-shadow:0 0 0 3px rgba(148,163,184,.18)}

.candidatura-sec{background:linear-gradient(180deg,var(--cr) 0%,var(--wh) 100%)}
.candidatura-inner{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center}
.candidatura-text .sec-title{max-width:100%}
.candidatura-text p{font-size:var(--fs-base);color:var(--gr);margin-top:1.1rem;line-height:1.8}
.candidatura-card{position:relative;background:var(--grad-navy);border-radius:var(--r-lg);padding:2.4rem;color:#fff;overflow:hidden;box-shadow:var(--sh-3)}
.candidatura-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad-teal)}
/* alone teal in alto a destra, come sulle card scure della home */
.candidatura-card::after{content:"";position:absolute;top:-40%;right:-30%;width:90%;height:110%;background:radial-gradient(ellipse,rgba(0,201,177,.22) 0%,transparent 62%);pointer-events:none}
.candidatura-card>*{position:relative}
.candidatura-card-title{font-size:1.15rem;font-weight:700;color:#fff;margin-bottom:.6rem;letter-spacing:-.015em}
.candidatura-card-sub{font-size:.92rem;color:var(--on-navy-soft);margin-bottom:1.6rem;line-height:1.7}
.req-list{list-style:none;display:flex;flex-direction:column;gap:.55rem;margin-bottom:1.8rem}
.req-list li{font-size:.89rem;color:var(--on-navy);display:flex;align-items:flex-start;gap:.6rem;line-height:1.5}
.req-list li::before{content:"→";color:var(--gl);font-weight:700;flex-shrink:0}
.cand-btns{display:flex;flex-direction:column;gap:.7rem}
.btn-cta{position:relative;overflow:hidden;display:block;background:var(--grad-teal);color:#fff;padding:.85rem 1.8rem;font-size:.86rem;font-weight:700;letter-spacing:.02em;text-decoration:none;border-radius:var(--r-sm);text-align:center;box-shadow:var(--sh-teal);transition:transform .22s var(--ease),box-shadow .22s var(--ease)}
.btn-cta:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,168,150,.4)}
/* riflesso che attraversa il bottone al passaggio del mouse */
.btn-cta::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.32) 50%,transparent 70%);transform:translateX(-110%);transition:transform .7s var(--ease-out)}
.btn-cta:hover::after{transform:translateX(110%)}
.btn-cta-outline{display:block;background:rgba(255,255,255,.06);color:var(--on-navy);border:1.5px solid rgba(255,255,255,.22);padding:.83rem 1.8rem;font-size:.86rem;font-weight:700;letter-spacing:.02em;text-decoration:none;border-radius:var(--r-sm);text-align:center;transition:background .22s var(--ease),border-color .22s var(--ease),color .22s var(--ease),transform .22s var(--ease)}
.btn-cta-outline:hover{border-color:var(--gl);color:#fff;background:rgba(255,255,255,.12);transform:translateY(-3px)}

/* ---- LEAFLET ---- */
.leaflet-tooltip{font-family:'Inter',sans-serif;font-size:.78rem;border:none;border-radius:var(--r-xs);box-shadow:var(--sh-2);padding:.45rem .75rem}

/* ---- RESPONSIVE ---- */
@media(max-width:900px){
  .candidatura-inner{grid-template-columns:1fr;gap:2.4rem}

@media(max-width:860px){

// =====================
// MAPPA REGIONI
// =====================
let currentLang = 'it';
let geoLayer = null;
let leafletMap = null;

document.addEventListener('DOMContentLoaded', function() {
  leafletMap = L.map('mappa-biologi', { scrollWheelZoom: false }).setView([42.5, 12.5], 5);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(leafletMap);

  fetch('https://raw.githubusercontent.com/openpolis/geojson-italy/master/geojson/limits_IT_regions.geojson')
    .then(r => r.json())
    .then(data => {
      buildGeoLayer(data);
      setTimeout(() => leafletMap.invalidateSize(), 300);
      window._geojsonData = data;
    })
    .catch(() => {
      document.getElementById('mappa-biologi').insertAdjacentHTML('afterbegin',
        '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#5A6A7A;font-size:.9rem;position:relative;z-index:1">Mappa temporaneamente non disponibile</div>'
      );
    });
});

function isAttiva(feature) {
  const nome = feature.properties.reg_name || feature.properties.NAME_1 || '';
  return regioniAttive.some(r => nome.toLowerCase().includes(r.toLowerCase()));
}

function buildGeoLayer(data) {
  if (geoLayer) { leafletMap.removeLayer(geoLayer); }
  geoLayer = L.geoJSON(data, {
    style: feature => ({
      fillColor: isAttiva(feature) ? '#00A896' : '#94a3b8',
      fillOpacity: isAttiva(feature) ? 0.55 : 0.22,
      color: isAttiva(feature) ? '#007a6e' : '#64748b',
      weight: 1.2,
      opacity: 0.8
    }),
    onEachFeature: (feature, layer) => {
      const nome = feature.properties.reg_name || feature.properties.NAME_1 || '';
      const attiva = isAttiva(feature);
      layer.bindTooltip(() => {
        const t = T[currentLang];
        return `<strong>${nome}</strong><br><span style="font-size:.72rem;color:${attiva ? '#00A896' : '#94a3b8'}">${attiva ? t.map_tooltip_attivo : t.map_tooltip_espansione}</span>`;
      }, { sticky: true, direction: 'top', offset: [0, -4] });
      layer.on('mouseover', () => { if (!attiva) layer.setStyle({ fillOpacity: 0.38 }); });
      layer.on('mouseout', () => layer.setStyle({
        fillColor: attiva ? '#00A896' : '#94a3b8',
        fillOpacity: attiva ? 0.55 : 0.22
      }));
    }
  }).addTo(leafletMap);
}

// =====================
// RENDER PRINCIPALE
// =====================
function render(l) {
  currentLang = l;
  const t = T[l];
  document.documentElement.lang = l;

  document.querySelectorAll('[data-k]').forEach(el => {
    const k = el.getAttribute('data-k');
    if (k.startsWith('nav') && k !== 'nav_cta') {
      const i = parseInt(k.replace('nav', ''));
      if (!isNaN(i) && t.nav[i] !== undefined) { el.textContent = t.nav[i]; return; }
    }
    if (t[k] !== undefined) el.innerHTML = t[k];
  });

  document.querySelectorAll('.lb').forEach(b =>
    b.classList.toggle('active', b.textContent.toLowerCase() === l)
  );

  document.getElementById('req-list').innerHTML =
    t.req_items.map(i => `<li>${i}</li>`).join('');

  document.getElementById('cand-cta-btn').href = t.cand_cta_href;
  document.getElementById('cta-scuole-btn').href = t.cta_scuole_href;
  document.getElementById('hero-photo').alt = t.hero_photo_alt;

  if (window._geojsonData && geoLayer) {
    buildGeoLayer(window._geojsonData);
  }
}

function setLang(l) { render(l); }

// Menu mobile (hamburger)
(function(){
  const nav = document.querySelector('nav');
  const toggle = document.getElementById('navToggle');
  if (!nav || !toggle) return;
  function setOpen(open){
    nav.classList.toggle('nav-open', open);
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  toggle.addEventListener('click', () => setOpen(!nav.classList.contains('nav-open')));
  nav.querySelectorAll('.nav-links a, .nav-cta').forEach(a =>
    a.addEventListener('click', () => setOpen(false))
  );
})();

render('it');

// Movimento: nav compatta, barra di lettura, reveal allo scroll e
// conteggio dei numeri — come sulla home. Tutto opzionale: se il JS
// non parte (o con motion ridotto) la pagina resta leggibile.
(function(){
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const nav = document.querySelector('body > nav');
  const bar = document.getElementById('progressBar');
  let ticking = false;
  function onScroll(){
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const y = window.scrollY;
      if (nav) nav.classList.toggle('scrolled', y > 40);
      if (bar) {
        const max = document.documentElement.scrollHeight - window.innerHeight;
        bar.style.transform = 'scaleX(' + (max > 0 ? Math.min(y / max, 1) : 0) + ')';
      }
      ticking = false;
    });
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  // Senza IntersectionObserver (o con motion ridotto) si toglie la classe:
  // i contenuti tornano visibili invece di restare nascosti per sempre.
  if (reduced || !('IntersectionObserver' in window)) {
    document.documentElement.classList.remove('js-reveal');
    return;
  }

  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      e.target.classList.add('is-in');
      io.unobserve(e.target);
      if (e.target.classList.contains('stats-grid')) countUp(e.target);
    });
  }, { rootMargin: '0px 0px -12% 0px', threshold: .12 });
  document.querySelectorAll('[data-reveal],[data-reveal-stagger]').forEach(el => io.observe(el));

  // Conteggio progressivo dei numeri della fascia statistiche.
  function countUp(grid){
    grid.querySelectorAll('.stat-num').forEach(el => {
      const m = el.textContent.trim().match(/^(\D*)(\d+)(\D*)$/);
      if (!m) return;
      const [, pre, numStr, post] = m, target = +numStr, dur = 1400, t0 = performance.now();
      function step(now){
        const p = Math.min((now - t0) / dur, 1);
        const eased = 1 - Math.pow(1 - p, 3); // ease-out cubica
        el.textContent = pre + Math.round(target * eased) + post;
        if (p < 1) requestAnimationFrame(step);
      }
      el.textContent = pre + '0' + post;
      requestAnimationFrame(step);
    });
  }
})();
