/* ============ CSS specifico di scuole.html ============
   Hero, fascia numeri, mappa, bottoni e fascia CTA vivono in

   che è proprio di questa pagina. */

/* ---- MAPPA ---- */
.map-sec{background:linear-gradient(180deg,var(--cr) 0%,#fff 100%)}
.legend-dot.completo{background:#00A896;box-shadow:0 0 0 3px rgba(0,168,150,.18)}
.legend-dot.kit{background:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.18)}
.legend-dot.attivazione{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.18)}
.attivazione-box{margin-top:1.2rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;font-size:.83rem}
.attivazione-label{font-weight:700;color:var(--g)}
.attivazione-chips{display:inline-flex;gap:.5rem;flex-wrap:wrap}
.attivazione-chip{display:inline-flex;align-items:center;gap:.3rem;background:rgba(245,158,11,.12);color:#b45309;border:1px solid rgba(245,158,11,.4);padding:.28rem .8rem;border-radius:var(--r-pill);font-weight:600;transition:background .22s var(--ease),transform .22s var(--ease)}
.attivazione-chip:hover{background:rgba(245,158,11,.2);transform:translateY(-2px)}

/* ---- SCUOLE DELLA RETE ---- */
.scuole-sec{background:linear-gradient(180deg,#fff 0%,var(--wh) 100%)}
.scuole-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;margin-top:2.6rem}
.scuola-card{position:relative;background:#fff;border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-1);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.scuola-card:hover{transform:translateY(-7px);box-shadow:var(--sh-2)}
.scuola-badge{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:.26rem .7rem;border-radius:var(--r-pill);margin-bottom:.9rem;color:#fff}
.scuola-badge.completo{background:var(--grad-teal)}
.scuola-badge.kit{background:linear-gradient(135deg,#3b82f6,#60a5fa)}
.scuola-badge.attivazione{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.scuola-body{padding:1.6rem}
.scuola-nome{font-size:1.02rem;font-weight:700;color:var(--g);margin-bottom:.35rem;line-height:1.3;letter-spacing:-.015em}
.scuola-luogo{font-size:.84rem;color:var(--gr);margin-bottom:1rem}
.scuola-meta{display:flex;flex-direction:column;gap:.35rem}
.scuola-meta-row{font-size:.84rem;color:var(--gr);display:flex;align-items:center;gap:.45rem;line-height:1.45}
.scuola-meta-row strong{color:var(--g);font-weight:700;font-variant-numeric:tabular-nums}
/* testimonianza: stessa filigrana di virgolette della home */
.scuola-testimonianza{position:relative;margin-top:1.2rem;padding:1.1rem 1.1rem 1rem 1.2rem;background:var(--cr);border-left:3px solid var(--gm);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:.87rem;color:var(--gr);line-height:1.65;font-style:italic}
.scuola-testimonianza::before{content:"\201C";position:absolute;top:-.05em;right:.5rem;font-size:3.4rem;line-height:1;font-family:Georgia,serif;color:var(--gl);opacity:.2;pointer-events:none}

/* ---- COME ADERIRE ---- */
.aderire-sec{background:var(--grad-navy);color:#fff;overflow:hidden}
.aderire-sec::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 85% 5%,rgba(0,201,177,.16) 0%,transparent 55%),radial-gradient(ellipse at 10% 95%,rgba(59,130,246,.12) 0%,transparent 55%);pointer-events:none}
.aderire-sec>*{position:relative}
.aderire-sec .sec-title{color:#fff;max-width:100%}
.aderire-sec .eyebrow{color:var(--gl)}
.aderire-intro{font-size:var(--fs-base);color:var(--on-navy-soft);margin-top:1.1rem;margin-bottom:2.8rem;line-height:1.8;max-width:640px}
.aderire-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
.aderire-card{--c:var(--gl);position:relative;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);border-radius:var(--r-lg);padding:2.4rem;overflow:hidden;display:flex;flex-direction:column;transition:transform .3s var(--ease),background .3s var(--ease),border-color .3s var(--ease),box-shadow .3s var(--ease)}
.aderire-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--c)}
/* alone del colore della modalità, come sulle card dei 6 moduli */
.aderire-card::after{content:"";position:absolute;top:-70%;left:50%;width:200%;height:140%;transform:translateX(-50%);background:radial-gradient(ellipse,var(--c) 0%,transparent 62%);opacity:0;transition:opacity .35s var(--ease);pointer-events:none}
.aderire-card>*{position:relative}
.aderire-card:hover{transform:translateY(-6px);background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.16);box-shadow:var(--sh-dark)}
.aderire-card:hover::after{opacity:.13}
.aderire-card.kit-card{--c:#60a5fa}
.aderire-card.completo-card{--c:var(--gl)}
.aderire-tipo{font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:.6rem;color:var(--c)}
.aderire-nome{font-size:1.3rem;font-weight:800;color:#fff;margin-bottom:.8rem;line-height:1.2;letter-spacing:-.02em}
.aderire-desc-card{font-size:.93rem;color:var(--on-navy-soft);line-height:1.75;margin-bottom:1.5rem}
.aderire-include-title{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--c);margin-bottom:.8rem}
.aderire-items{list-style:none;display:flex;flex-direction:column;gap:.5rem;margin-bottom:1.5rem}
.aderire-items li{font-size:.89rem;color:var(--on-navy);display:flex;align-items:flex-start;gap:.55rem;line-height:1.5}
.aderire-items li::before{content:"✓";font-weight:700;font-size:.8rem;flex-shrink:0;margin-top:.05rem;color:var(--c)}
.aderire-ideale{background:rgba(255,255,255,.06);border-radius:var(--r-sm);padding:.9rem 1.1rem;font-size:.86rem;color:var(--on-navy-soft);line-height:1.6;margin-bottom:1.7rem}
.aderire-ideale strong{color:var(--on-navy)}
.aderire-cta{position:relative;overflow:hidden;margin-top:auto;display:block;text-align:center;padding:.85rem 1.5rem;border-radius:var(--r-sm);font-size:.88rem;font-weight:700;letter-spacing:.01em;text-decoration:none;color:#fff;transition:transform .22s var(--ease),box-shadow .22s var(--ease)}
.aderire-cta::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.32) 50%,transparent 70%);transform:translateX(-110%);transition:transform .7s var(--ease-out)}
.aderire-cta:hover::after{transform:translateX(110%)}
.aderire-cta:hover{transform:translateY(-3px)}
.kit-card .aderire-cta{background:linear-gradient(135deg,#3b82f6,#60a5fa);box-shadow:0 8px 22px rgba(59,130,246,.32)}
.kit-card .aderire-cta:hover{box-shadow:0 14px 34px rgba(59,130,246,.42)}
.completo-card .aderire-cta{background:var(--grad-teal);box-shadow:var(--sh-teal)}
.completo-card .aderire-cta:hover{box-shadow:0 14px 34px rgba(0,168,150,.4)}

/* ---- LEAFLET ---- */
.leaflet-popup-content-wrapper{border-radius:var(--r-sm);box-shadow:var(--sh-2)}
.leaflet-popup-content{margin:14px 18px;font-family:'Inter',sans-serif}
.popup-nome{font-size:.92rem;font-weight:700;color:var(--g);margin-bottom:.3rem;line-height:1.3}
.popup-luogo{font-size:.75rem;color:var(--gr);margin-bottom:.5rem}
.popup-badge{display:inline-block;font-size:.63rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.2rem .6rem;border-radius:var(--r-pill);margin-bottom:.5rem;color:#fff}

.popup-meta{font-size:.75rem;color:var(--gr);display:flex;flex-direction:column;gap:.2rem}
.popup-meta span strong{color:var(--g)}

/* ---- RESPONSIVE ---- */
@media(max-width:900px){

const totScuole = scuoleAderenti.length;
const totBambini = scuoleAderenti.reduce((a, s) => a + (s.bambini || 0), 0);
const valsM = scuoleAderenti.map(s => s.miglioramentoPrePost).filter(v => v !== null);
const mediaM = valsM.length ? Math.round(valsM.reduce((a, b) => a + b, 0) / valsM.length) : 0;

function animateCounter(el, target, suffix) {
  let v = 0;
  const step = Math.ceil(target / 60);
  const t = setInterval(() => {
    v += step;
    if (v >= target) { v = target; clearInterval(t); }
    el.innerHTML = v + suffix;
  }, 16);
}

const obs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      animateCounter(document.getElementById('counter-scuole'), totScuole, '');
      animateCounter(document.getElementById('counter-bambini'), totBambini, '');
      const mEl = document.getElementById('counter-migliora');
      let v = 0;
      const step = Math.ceil(mediaM / 60);
      const t = setInterval(() => {
        v += step;
        if (v >= mediaM) { v = mediaM; clearInterval(t); }
        mEl.innerHTML = v + '<span class="stat-unit">%</span>';
      }, 16);
      obs.disconnect();
    }
  });
}, { threshold: 0.3 });
obs.observe(document.querySelector('.stats-sec'));

let leafletMap = null;
let currentLang = 'it';

function formatData(str, lang) {
  if (!str) return T[lang].labels.nd;
  const [y, m] = str.split('-');
  const mesiIT = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
  const mesiES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const mesiEN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const mesi = lang === 'es' ? mesiES : lang === 'en' ? mesiEN : mesiIT;
  return mesi[parseInt(m, 10) - 1] + ' ' + y;
}

function makeIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:18px;height:18px;border-radius:50%;background:${color};border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)"></div>`,
    iconSize: [18, 18], iconAnchor: [9, 9], popupAnchor: [0, -12]
  });
}

document.addEventListener('DOMContentLoaded', function() {
  leafletMap = L.map('mappa-italia', { scrollWheelZoom: false }).setView([42.5, 12.5], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(leafletMap);

  const iconCompleto = makeIcon('#00A896');
  const iconKit = makeIcon('#3b82f6');
  const iconAttivazione = makeIcon('#f59e0b');

  scuoleAderenti.forEach(s => {
    const icon = s.tipoAdesione === 'completo' ? iconCompleto : s.tipoAdesione === 'attivazione' ? iconAttivazione : iconKit;
    const marker = L.marker([s.lat, s.lng], { icon }).addTo(leafletMap);
    marker.bindPopup(() => {
      const t = T[currentLang];
      const lb = t.labels;
      const badgeClass = s.tipoAdesione === 'completo' ? 'completo' : s.tipoAdesione === 'attivazione' ? 'attivazione' : 'kit';
      const badgeTxt = s.tipoAdesione === 'completo' ? lb.tipo_completo : s.tipoAdesione === 'attivazione' ? lb.tipo_attivazione : lb.tipo_kit;
      return `
        <div class="popup-nome">${s.nome}</div>
        <div class="popup-luogo">📍 ${s.comune} (${s.provincia}) · ${s.regione}</div>
        <span class="popup-badge ${badgeClass}">${badgeTxt}</span>
        <div class="popup-meta">
          <span><strong>${lb.popup_bambini}:</strong> ${s.bambini !== null ? s.bambini : lb.nd}</span>
          ${s.classi !== null ? `<span><strong>${lb.popup_classi}:</strong> ${s.classi}</span>` : ''}
          <span><strong>${lb.popup_attivazione}:</strong> ${formatData(s.dataAttivazione, currentLang)}</span>
          ${s.miglioramentoPrePost !== null ? `<span><strong>${lb.miglioramento}:</strong> +${s.miglioramentoPrePost}%</span>` : ''}
        </div>
      `;
    }, { maxWidth: 260 });
  });

  // Citta in attivazione: pin gialli, popup generico (non sono scuole)
  cittaAttivazione.forEach(c => {
    const marker = L.marker([c.lat, c.lng], { icon: iconAttivazione }).addTo(leafletMap);
    marker.bindPopup(() => {
      const lb = T[currentLang].labels;
      return `
        <div class="popup-nome">${c.nome} (${c.provincia})</div>
        <div class="popup-luogo">📍 ${c.regione}</div>
        <span class="popup-badge attivazione">${lb.tipo_attivazione}</span>
      `;
    }, { maxWidth: 220 });
  });

  setTimeout(() => leafletMap.invalidateSize(), 300);
});

// =====================
// RENDER
// =====================
function renderScuole(t) {
  const lb = t.labels;
  document.getElementById('citta-attivazione').innerHTML = cittaAttivazione.map(c =>
    `<span class="attivazione-chip">📍 ${c.nome} (${c.provincia})</span>`
  ).join('');
  document.getElementById('scuole-grid').innerHTML = scuoleAderenti.map(s => {
    const tipo = s.tipoAdesione;
    const accent = tipo === 'completo' ? '#00A896' : tipo === 'attivazione' ? '#f59e0b' : '#3b82f6';
    const badgeClass = tipo === 'completo' ? 'completo' : tipo === 'attivazione' ? 'attivazione' : 'kit';
    const badgeTxt = tipo === 'completo' ? lb.tipo_completo : tipo === 'attivazione' ? lb.tipo_attivazione : lb.tipo_kit;
    const classiLabel = s.classi === 1 ? lb.classi : lb.classi_pl;

    return `
      <div class="scuola-card" style="border-top:3px solid ${accent}">
        <div class="scuola-body">
          <span class="scuola-badge ${badgeClass}">${badgeTxt}</span>
          <div class="scuola-nome">${s.nome}</div>
          <div class="scuola-luogo">📍 ${s.comune} (${s.provincia}) · ${s.regione}</div>
          <div class="scuola-meta">
            ${s.bambini !== null ? `<div class="scuola-meta-row">👧 <strong>${s.bambini}</strong> ${lb.bambini}</div>` : ''}
            ${s.classi !== null ? `<div class="scuola-meta-row">🏛️ <strong>${s.classi}</strong> ${classiLabel} ${lb.aderente}</div>` : ''}
            ${s.dataAttivazione ? `<div class="scuola-meta-row">📅 ${lb.attivazione}: <strong>${formatData(s.dataAttivazione, currentLang)}</strong></div>` : ''}
            ${s.miglioramentoPrePost !== null ? `<div class="scuola-meta-row">📈 ${lb.miglioramento}: <strong>+${s.miglioramentoPrePost}%</strong></div>` : ''}
            ${s.raccomandazioneInsegnanti !== null ? `<div class="scuola-meta-row">⭐ ${lb.raccomandazione}: <strong>${s.raccomandazioneInsegnanti}%</strong></div>` : ''}
          </div>
          ${s.testimonianza ? `<div class="scuola-testimonianza">"${s.testimonianza}"</div>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function renderAderire(t) {
  document.getElementById('aderire-grid').innerHTML = t.modalita.map(m => `
    <div class="aderire-card ${m.classe || m.clase}-card">
      <div class="aderire-tipo">${m.tipo}</div>
      <div class="aderire-nome">${m.nome}</div>
      <p class="aderire-desc-card">${m.desc}</p>
      <div class="aderire-include-title">${m.include_title}</div>
      <ul class="aderire-items">${m.items.map(i => `<li>${i}</li>`).join('')}</ul>
      <div class="aderire-ideale">${m.ideale}</div>
      <a href="${m.mailto}" class="aderire-cta">${m.cta}</a>
    </div>
  `).join('');
}

function render(l) {
  currentLang = l;
  const t = T[l];
  document.documentElement.lang = l;

  document.querySelectorAll('[data-k]').forEach(el => {
    const k = el.getAttribute('data-k');
    if (k.startsWith('nav') && k !== 'nav_cta') {
      const i = parseInt(k.replace('nav', ''));
      if (!isNaN(i) && t.nav[i] !== undefined) { el.textContent = t.nav[i]; return; }
    }
    if (t[k] !== undefined) el.innerHTML = t[k];
  });

  document.querySelectorAll('.lb').forEach(b =>
    b.classList.toggle('active', b.textContent.toLowerCase() === l)
  );

  document.getElementById('cta-btn1').href = t.cta_btn1_href;
  document.getElementById('hero-photo').alt = t.hero_photo_alt;

  renderScuole(t);
  renderAderire(t);
}

function setLang(l) { render(l); }

// Menu mobile (hamburger)
(function(){
  const nav = document.querySelector('nav');
  const toggle = document.getElementById('navToggle');
  if (!nav || !toggle) return;
  function setOpen(open){
    nav.classList.toggle('nav-open', open);
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  toggle.addEventListener('click', () => setOpen(!nav.classList.contains('nav-open')));
  nav.querySelectorAll('.nav-links a, .nav-cta').forEach(a =>
    a.addEventListener('click', () => setOpen(false))
  );
})();

render('it');

// Movimento: nav compatta, barra di lettura e reveal allo scroll — come
// sulla home. Tutto opzionale: se il JS non parte (o con motion ridotto)
// la pagina resta perfettamente leggibile.
(function(){
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const nav = document.querySelector('body > nav');
  const bar = document.getElementById('progressBar');
  let ticking = false;
  function onScroll(){
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const y = window.scrollY;
      if (nav) nav.classList.toggle('scrolled', y > 40);
      if (bar) {
        const max = document.documentElement.scrollHeight - window.innerHeight;
        bar.style.transform = 'scaleX(' + (max > 0 ? Math.min(y / max, 1) : 0) + ')';
      }
      ticking = false;
    });
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  // Senza IntersectionObserver (o con motion ridotto) si toglie la classe:
  // i contenuti tornano visibili invece di restare nascosti per sempre.
  if (reduced || !('IntersectionObserver' in window)) {
    document.documentElement.classList.remove('js-reveal');
    return;
  }

  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      e.target.classList.add('is-in');
      io.unobserve(e.target);
    });
  }, { rootMargin: '0px 0px -12% 0px', threshold: .12 });
  document.querySelectorAll('[data-reveal],[data-reveal-stagger]').forEach(el => io.observe(el));
})();
</script>
